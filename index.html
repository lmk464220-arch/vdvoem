<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вдвоём"><meta name="theme-color" content="#0b0b0c">
<title>Смотрим вдвоём</title>
<link rel="apple-touch-icon" id="appicon"><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0b0b0c;--panel:rgba(30,30,36,.78);--text:#f2f2f2;--muted:#9a9aa2;--ok:#3ecf6e;--warn:#f5b83d;--bad:#ff4d4d;--accent:#d7dbe2;
 --glass:linear-gradient(135deg,rgba(60,60,70,.62),rgba(28,28,34,.7) 45%,rgba(50,50,60,.62));--edge:1px solid rgba(255,255,255,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,system-ui,sans-serif;overflow:hidden}
#amb{position:fixed;inset:-10%;width:120%;height:120%;filter:blur(40px) saturate(190%) brightness(.8);z-index:0}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px}
.pill{background:var(--glass);border:var(--edge);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.pill.ok{background:linear-gradient(180deg,rgba(62,207,110,.6),rgba(62,207,110,.3))}#room.ok{background:var(--glass)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 6px var(--bad);margin-right:6px;vertical-align:1px}#room.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.top .sp{flex:1}
.vwrap{position:relative;margin:0 10px;border-radius:18px;overflow:hidden;background:#000;flex:1;min-height:200px;border:2px solid transparent;transition:border-color .2s}
.vwrap.paused{border-color:var(--accent)}
video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.vpic{position:absolute;inset:0}
/* камеры включены (вертикально): шоу по центру свободного места, под ним два небольших окна камер в ряд */
@media (orientation:portrait){
 .vwrap.camon{display:flex;flex-direction:column;gap:8px;background:transparent;padding-bottom:8px}
 .vwrap.camon .vpic{position:relative;inset:auto;flex:1;min-height:0;border-radius:14px;overflow:hidden}
 .vwrap.camon .cams{position:relative;inset:auto;flex:0 0 auto;display:flex;gap:8px;justify-content:center;align-items:flex-end}
 .vwrap.camon .cams .tile,.vwrap.camon .cams .tile.me,.vwrap.camon.big .cams .tile{flex:0 0 28%;width:auto;height:auto;aspect-ratio:3/4;border-radius:14px}
 .vwrap.camon .cams button{top:-6px;right:calc(22% - 18px);bottom:auto;left:auto}}
.toast{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
#ytbox{position:absolute;inset:0;background:#000;z-index:1}#ytbox[hidden]{display:none}#ytbox iframe{width:100%;height:100%;border:0}
.toast,.cd{z-index:3}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 120px/1 -apple-system,system-ui,sans-serif;color:#fff;text-shadow:0 0 30px rgba(255,255,255,.6)}
.cd[hidden]{display:none}
.cams{position:absolute;right:8px;top:8px;display:flex;gap:4px;align-items:flex-end;z-index:3}.cams[hidden]{display:none}
.cams .tile{position:relative;width:96px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#111;border:1px solid rgba(255,255,255,.3)}
.cams .tile.me{width:64px}.cams.big .tile{width:150px}.cams.big .tile.me{width:96px}.cams .tile[hidden]{display:none}
.cams video{position:absolute;top:0;left:0;right:0;bottom:0;width:100%!important;height:100%!important;max-width:none;object-fit:cover;background:#111}.cams .tile.me video{transform:scaleX(-1);-webkit-transform:scaleX(-1)}
.cams span{position:absolute;left:4px;bottom:3px;font-size:10px;color:#ddd;text-shadow:0 1px 2px #000}
.cams button{position:absolute;bottom:-8px;left:-8px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.75);color:#fff;font-size:12px}
.ctl{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.ctl button{flex:0 0 auto;font:600 17px -apple-system,system-ui,sans-serif;color:#fff;background:var(--glass);border:var(--edge);border-radius:999px;padding:10px 14px}
.ctl #pp{flex:1;font-size:20px;background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.seek{display:flex;align-items:center;gap:8px;padding:2px 14px 6px;font:13px ui-monospace,Menlo,monospace;color:var(--muted)}
.seek input{flex:1;accent-color:var(--accent)}
.ovl{position:absolute;left:8px;top:8px;right:30%;max-height:calc(100% - 16px);overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;z-index:2}
.ovl div{max-width:100%;padding:5px 10px;border-radius:14px;font-size:15px;line-height:1.3;word-wrap:break-word;color:#fff;
 background:rgba(0,0,0,.42);text-shadow:0 1px 2px rgba(0,0,0,.8);transition:opacity 1s,transform .3s;animation:pop .25s ease-out;pointer-events:auto}
.ovl div b{color:#ffffff;font-weight:700}.ovl .me b{color:#aab3c2}
.ovl .big{font-size:30px;background:none;padding:0 2px}.ovl .sys{color:#cfcfd6;font-size:12px;background:rgba(0,0,0,.3)}
.ovl .gone{opacity:0}@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.log .vm{text-decoration:underline dotted}
.side{display:contents}
.dock2{margin:8px 10px 6px}
.extra{background:var(--glass);border:var(--edge);border-radius:20px;margin-bottom:8px;padding:4px 0;-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}.extra[hidden]{display:none}
.emo{display:flex;gap:2px;overflow-x:auto;padding:4px 8px}.emo button{font-size:26px;background:none;border:0;padding:2px 4px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:2px 10px 6px}.quick button{flex:0 0 auto;font:600 14px -apple-system,system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.1);border:var(--edge);border-radius:999px;padding:7px 12px}
.inp{display:flex;gap:6px;padding:6px;align-items:center;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 45%,rgba(255,255,255,.10));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 30px rgba(0,0,0,.45)}
.inp input{flex:1;min-width:0;font:16px -apple-system,system-ui,sans-serif;color:#fff;background:transparent;border:0;outline:0;padding:10px 6px}
.inp input::placeholder{color:rgba(255,255,255,.55)}
.inp button{flex:0 0 auto;font-size:19px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:50%;width:42px;height:42px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.inp #send{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.14));border-color:rgba(255,255,255,.4)}
#ptt{background:rgba(255,255,255,.14);border:var(--edge);touch-action:none;-webkit-user-select:none;user-select:none}
#ptt.live{background:rgba(62,207,110,.45);border-color:rgba(62,207,110,.8)}#ptt.mut{background:rgba(255,77,77,.4)}
#ptt.rec{background:rgba(255,255,255,.85);box-shadow:0 0 0 6px rgba(255,255,255,.25)}#ptt.hear{box-shadow:0 0 0 4px rgba(62,207,110,.7)}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.inst{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:14px;line-height:1.45}
.inst[hidden]{display:none}.inst b{color:#fff}.inst .x{float:right;opacity:.6;padding:0 4px}
.inst ol{margin:6px 0 0;padding-left:20px}.inst li{margin:3px 0}
.sbox{max-height:calc(100vh - 64px);max-height:calc(100dvh - 64px);overflow-y:auto;-webkit-overflow-scrolling:touch;width:100%;background:#17171a;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));border-top:var(--edge)}
.sbox h2{margin:0 0 8px;font-size:22px}.sbox p{color:var(--muted);margin:6px 0 12px;font-size:15px}
.sbox button,.sbox label.btn{display:block;width:100%;text-align:center;font:600 18px -apple-system,system-ui,sans-serif;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));color:#fff;margin:8px 0}
.sbox button.sec{background:#2a2a30}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.35);margin:-10px auto 12px}
.sbox.drag{transition:none!important}.sbox{transition:transform .25s ease}
.sbox [hidden]{display:none!important}
#dlpick{background:linear-gradient(180deg,rgba(62,207,110,.55),rgba(62,207,110,.3));border-color:rgba(62,207,110,.7)}
#share[hidden]{display:none!important}
#share button{background:linear-gradient(180deg,rgba(62,207,110,.55),rgba(62,207,110,.3));border-color:rgba(62,207,110,.7)}
.sbox input{width:100%;font:700 26px ui-monospace,Menlo,monospace;text-align:center;padding:12px;border-radius:14px;border:0;margin:6px 0}
.code{font:800 48px ui-monospace,Menlo,monospace;letter-spacing:6px;color:var(--ok);text-align:center;margin:8px 0}
.st{min-height:20px;font-size:15px;color:var(--warn)}
@media (orientation:landscape){
 .cams{left:8px;right:8px;top:auto;bottom:8px;justify-content:space-between;pointer-events:none}
 .cams .tile,.cams .tile.me{width:72px;pointer-events:auto}.cams.big .tile,.cams.big .tile.me{width:110px}
 .cams button{top:-10px;right:-6px;bottom:auto;left:auto;pointer-events:auto}}
@media (orientation:landscape){
 .app{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;grid-template-rows:1fr auto 1fr auto;
  grid-template-areas:"ctl vid vid room" "ctl vid vid camb" "ctl vid vid menu" "seek seek dock dock";column-gap:6px}
 .side,.top{display:contents}.top .sp{display:none}
 .vwrap{grid-area:vid;margin:6px 0 0;min-height:0;height:calc(100% - 6px);width:auto;max-width:100%;aspect-ratio:var(--ar,16/9);justify-self:center}
 .ctl{grid-area:ctl;flex-direction:column;justify-content:center;padding:6px 0 6px 6px;gap:10px}
 .ctl button{width:64px;padding:10px 0;font-size:15px}.ctl #pp{flex:0 0 auto;height:72px;font-size:16px;line-height:1.15}
 #room{grid-area:room;align-self:end;justify-self:center;max-width:76px;white-space:normal;text-align:center;font-size:12px;padding:6px 8px;margin:0 6px 0 0}
 #camb{grid-area:camb;align-self:center;justify-self:center;margin:10px 6px 10px 0}
 #menu{grid-area:menu;align-self:start;justify-self:center;margin:0 6px 0 0}
 .seek{grid-area:seek;padding:4px 6px 6px 12px;align-self:center}
 .dock2{grid-area:dock;margin:4px 8px 6px 0;position:relative}
 .dock2 .extra{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;z-index:5}
 .inp{padding:4px}.inp button{width:36px;height:36px;font-size:16px}.inp input{padding:6px 4px;font-size:15px}}

/* горизонтально: шоу на весь экран, всё управление — полупрозрачное поверх */
@media (orientation:landscape){
 .app{display:block;padding:0}
 .vwrap,.vwrap.camon{position:fixed;inset:0;margin:0;width:100vw;height:100vh;height:100dvh;max-width:none;aspect-ratio:auto;border:0;border-radius:0;z-index:0;background:#000}
 .vwrap.paused{border:0;box-shadow:inset 0 0 0 2px rgba(215,219,226,.5)}
 .vpic{position:absolute;inset:0}
 .ovl{left:calc(var(--il,10px) + 76px);top:52px;right:40%}
 #room,#camb,#menu{position:fixed;top:8px;z-index:4;margin:0;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
 #room{left:var(--il,10px);max-width:none;white-space:nowrap;font-size:13px}
 #menu{right:var(--ir,10px)}
 #camb{right:calc(var(--ir,10px) + 52px)}
 .ctl{position:fixed;left:var(--cl,10px);top:50%;transform:translateY(-50%);z-index:4;flex-direction:column;gap:8px;padding:0}
 .ctl button,.ctl #pp{width:58px;padding:8px 0;font-size:13px;border-radius:16px;background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.22);box-shadow:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
 .ctl #pp{height:58px;font-size:14px}
 .seek{position:fixed;z-index:4;left:var(--il,10px);bottom:calc(env(safe-area-inset-bottom) + 6px);width:calc(50% - var(--il,10px));padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.35);color:#ddd}
 .dock2{position:fixed;z-index:4;right:var(--ir,10px);bottom:calc(env(safe-area-inset-bottom) + 4px);width:calc(48% - var(--ir,10px));margin:0}
 .inp{background:rgba(0,0,0,.35);box-shadow:none;padding:3px}
 .inp button{width:34px;height:34px;font-size:15px}.inp input{padding:5px 4px;font-size:15px}
 .cams{left:auto;right:var(--cr,10px);top:52px;bottom:auto;flex-direction:column;align-items:flex-end;justify-content:flex-start;gap:6px;pointer-events:auto}
 .cams .tile,.cams .tile.me{width:min(84px,calc((100dvh - 120px) / 2 * .75))}.cams.big .tile,.cams.big .tile.me{width:min(110px,calc((100dvh - 120px) / 2 * .75))}
 .cams button{top:-8px;right:-6px;left:auto;bottom:auto}
}

/* ===== меню в новом оформлении ===== */
.sbox{background:linear-gradient(180deg,#141a24,#0d1118);border-top:1px solid rgba(255,255,255,.08)}
.sbox .hd{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.sbox .hico{width:46px;height:46px;color:#5b9cf0;flex:0 0 auto}.sbox .hico svg{width:100%;height:100%}
.sbox .htx{flex:1;min-width:0}.sbox .hd h2{margin:0;font-size:27px;font-weight:800;letter-spacing:-.3px}
.sbox .ver{color:var(--muted);font-size:15px}
.sbox button.round{width:52px;height:52px;flex:0 0 auto;border-radius:16px;padding:13px;margin:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.sbox button.round svg{width:100%;height:100%}
.sbox .card{display:block;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:14px;margin:0 0 14px}
.sbox .card.row{display:flex;align-items:center;gap:14px;cursor:pointer}
.sbox .tile{width:54px;height:54px;flex:0 0 auto;border-radius:16px;background:rgba(255,255,255,.07);padding:13px;color:#fff}.sbox .tile svg{width:100%;height:100%}
.sbox .ctx{flex:1;min-width:0}.sbox .ctx b{display:block;font-size:17px;font-weight:600;margin-bottom:4px}.sbox .ctx small{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.sbox .chev{width:20px;height:20px;color:var(--muted);flex:0 0 auto}.sbox .chev svg{width:100%;height:100%}
.sbox button,.sbox label.btn{background:linear-gradient(180deg,rgba(70,80,100,.55),rgba(35,40,52,.7));border:1px solid rgba(255,255,255,.14);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.sbox .ib{display:flex;align-items:center;justify-content:center;gap:12px}
.sbox .ic{display:inline-flex;width:24px;height:24px;flex:0 0 auto}.sbox .ic.big{width:32px;height:32px}.sbox .ic svg{width:100%;height:100%}
.sbox .okline{color:var(--ok);margin:2px 4px 10px;min-height:0}.sbox .okline:empty{display:none}
.sbox .cht{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;margin:2px 2px 12px}.sbox .yt{width:30px;height:22px;display:inline-flex}.sbox .yt svg{width:100%;height:100%}
.sbox .fld{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:0 14px;margin:0 0 12px;color:var(--muted)}
.sbox .fld input{flex:1;min-width:0;background:transparent;color:#fff;font:16px -apple-system,system-ui,sans-serif;text-align:left;padding:14px 0;margin:0;border:0;outline:0;border-radius:0}
.sbox .fld input::placeholder{color:rgba(255,255,255,.45)}
.sbox .two{display:flex;gap:10px}.sbox .two button{flex:1;margin:0;font-size:16px;line-height:1.2;padding:14px 10px;text-align:left}
.sbox #dlpick{margin:12px 0 0}
.sbox .step{display:flex;align-items:center;gap:14px;margin:18px 2px 12px;color:#dfe3ea;font-size:16px;line-height:1.3}
.sbox .step .n{width:44px;height:44px;flex:0 0 auto;border-radius:50%;background:rgba(91,156,240,.12);color:#7fb2f5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.sbox .codewrap{display:flex;align-items:center;gap:12px;width:max-content;max-width:100%;margin:14px auto 12px;padding:6px 10px 6px 18px;border-radius:22px;border:1px solid rgba(62,207,110,.5);background:rgba(62,207,110,.08);color:var(--ok)}
.sbox .codewrap[hidden]{display:none!important}
.sbox .codewrap .code{margin:0;font-size:40px;letter-spacing:4px}
.sbox button.cp{width:44px;height:44px;padding:9px;margin:0;background:transparent;border:0;box-shadow:none;color:#cfd5de}.sbox button.cp svg{width:100%;height:100%}
.sbox #share.two{margin:0 0 6px}.sbox #share button{text-align:center;font-size:17px}
.sbox button.grn{background:linear-gradient(180deg,rgba(62,207,110,.35),rgba(30,110,70,.35));border-color:rgba(62,207,110,.6)}
.sbox #joinbox input{background:rgba(255,255,255,.92)}
.sbox label.btn.ib{display:flex}
.sbox #share #shareLink{background:linear-gradient(180deg,rgba(70,80,100,.55),rgba(35,40,52,.7));border-color:rgba(255,255,255,.14)}
.sbox .hd h2{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbox .hico{width:40px;height:40px}
.sbox .two button{gap:9px;padding:12px 8px;font-size:15px}
.sbox .two .ic.big{width:28px;height:28px}

/* ===== v28: жидкое стекло ===== */
.sheet{background:radial-gradient(60% 45% at 15% 30%,rgba(80,120,255,.35),transparent 70%),radial-gradient(55% 40% at 90% 55%,rgba(170,80,255,.28),transparent 70%),radial-gradient(60% 40% at 40% 95%,rgba(40,200,150,.22),transparent 70%),rgba(4,6,12,.45)}
.sbox{background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.06) 30%,rgba(255,255,255,.03) 60%,rgba(255,255,255,.10));
 -webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);
 border:1px solid rgba(255,255,255,.22);border-bottom:0;border-radius:30px 30px 0 0;
 box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 1px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(255,255,255,.08),0 -24px 60px rgba(0,0,0,.45)}
.sbox .card{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.sbox .tile,.sbox button.round{background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.sbox button,.sbox label.btn,.sbox #share #shareLink{background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(0,0,0,.18)}
.sbox button.grn,.sbox #dlpick{background:linear-gradient(180deg,rgba(62,207,110,.45),rgba(30,140,80,.25));border-color:rgba(110,230,150,.55);box-shadow:inset 0 1px 0 rgba(200,255,220,.4)}
.sbox button.cp{background:transparent;border:0;box-shadow:none}
.sbox .fld{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.16)}

let joinH=false,opened=false;const STALL=8000,RXMAX=6000;
function brokerOpen(u,k){const c=mqtt.connect(u,{protocolVersion:5,properties:{sessionExpiryInterval:120},clientId:'toxm_'+me+'_'+k,clean:false,reconnectPeriod:u===OWN?1500:500,connectTimeout:u===OWN?15000:6000});   /* до своего сервера на медленном мобильном даём больше времени */

/* ===== живая рация: звук 16 кГц, μ-law, порции по 0,2 с через комнату; у собеседника играет сразу (Web Audio) =====
   Работает одинаково в Chrome, Safari и на iPhone. Хуки задаёт приложение: LIVE.send(msg), LIVE.toast(text),
   LIVE.log(blob,dur,mine) или null (не сохранять фразы в чат), LIVE.out() — id устройства вывода (наушники) или '',
   LIVE.hear(on), LIVE.video() — видео шоу: пока говорит напарник, шоу приглушается до LIVE.duck (0…1). */
const LIVE={send:()=>{},toast:()=>{},log:null,out:()=>'',hear:()=>{},video:()=>null,duck:0.35,boost:1.4};
const LVA={cap:null,play:null,src:null,proc:null,on:false,sid:'',seq:0,acc:[],all:[],rest:null,t0:0,lead:0.3};
function lvPlayCtx(){if(!LVA.play){LVA.play=new (window.AudioContext||window.webkitAudioContext)();const c=LVA.play;
    try{LVA.dest=c.createMediaStreamDestination();LVA.el=new Audio();LVA.el.srcObject=LVA.dest.stream;LVA.el.setAttribute('playsinline','')}catch(_){LVA.dest=null}
    const out=LVA.dest||c.destination;
    /* рация громче и ровнее: усиление + компрессор (не даёт перегружать) */
    try{LVA.comp=c.createDynamicsCompressor();LVA.comp.threshold.value=-18;LVA.comp.knee.value=10;LVA.comp.ratio.value=3;LVA.comp.attack.value=0.005;LVA.comp.release.value=0.2;
      LVA.boost=c.createGain();LVA.boost.gain.value=LIVE.boost;LVA.boost.connect(LVA.comp);LVA.comp.connect(out)}catch(_){LVA.boost=null}
    /* постоянная «почти тишина» в выход: поток не пустеет между фразами */
    try{const g=c.createGain();g.gain.value=0.00001;const o=c.createOscillator();o.frequency.value=40;o.connect(g);g.connect(out);o.start()}catch(_){}}
  if(LVA.play.state!=='running')LVA.play.resume().catch(()=>{});
  if(LVA.el&&LVA.el.paused)LVA.el.play().catch(()=>{});
  const o=LIVE.out();if(o!==LVA.sink){LVA.sink=o;const t=LVA.el&&LVA.el.setSinkId?LVA.el:LVA.play;if(t.setSinkId)t.setSinkId(o||'').catch(()=>{})}return LVA.play}
function lvOut(){return LVA.boost||LVA.dest||LVA.play.destination}
/* --- приглушение шоу, пока говорит напарник. Где громкость видео не меняется (iPhone) — через Web Audio --- */
function lvVolOK(v){if(LVA.volok==null){const t=v.volume;try{v.volume=0.5}catch(_){}LVA.volok=Math.abs(v.volume-0.5)<0.01;try{v.volume=t}catch(_){}}return LVA.volok}
function lvRoute(force){const v=LIVE.video();if(!v||LVA.vgain||(!force&&lvVolOK(v))||!LVA.play||LVA.play.state!=='running')return;
  try{const c=LVA.play;LVA.vgain=c.createGain();LVA.vsrc=c.createMediaElementSource(v);LVA.vsrc.connect(LVA.vgain);LVA.vgain.connect(LVA.dest||c.destination)}catch(_){LVA.vgain=null;LVA.volok=true}}
function lvDuck(on){const v=LIVE.video();if(!v)return;const to=on?LIVE.duck:1;lvRoute();
  if(LVA.vgain){const g=LVA.vgain.gain,t=LVA.play.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(to,t+(on?0.15:0.6));return}
  clearInterval(LVA.duckT);const base=LVA.vbase!=null?LVA.vbase:(LVA.vbase=v.volume);const tgt=base*to;
  LVA.duckT=setInterval(()=>{const d=tgt-v.volume;if(Math.abs(d)<0.02){v.volume=tgt;clearInterval(LVA.duckT);if(!on)LVA.vbase=null;return}v.volume=Math.max(0,Math.min(1,v.volume+d*(on?0.5:0.15)))},30)}
function lvUnlock(){try{lvPlayCtx()}catch(_){}
  try{if(!LVA.cap)LVA.cap=new (window.AudioContext||window.webkitAudioContext)();if(LVA.cap.state!=='running')LVA.cap.resume().catch(()=>{});lvWorklet()}catch(_){}
  setTimeout(lvRoute,300)}
/* iPhone запускает звук только из касания — «будим» звук при любом касании/клике */
['touchend','click','keydown'].forEach(t=>document.addEventListener(t,()=>{if(!LVA.play||LVA.play.state!=='running'||(LVA.el&&LVA.el.paused)||!LVA.cap||LVA.cap.state!=='running'||(!LVA.vgain&&LIVE.video()&&LVA.volok!==true))lvUnlock()},{passive:true}));
function muEnc(x){x=Math.max(-1,Math.min(1,x||0));const s=x<0?0x80:0;let m=Math.log(1+255*Math.abs(x))/Math.log(256);return (~(s|Math.round(m*127)))&0xFF}
function muDec(u){u=~u&0xFF;const s=u&0x80,m=(u&0x7F)/127,x=(Math.pow(256,m)-1)/255;return s?-x:x}
function lvB64(u){let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(b)}
function lvUnB64(d){const s=atob(d),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function lvWav(parts){let n=0;parts.forEach(p=>{if(p)n+=p.length});const b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);let o=44;parts.forEach(p=>{if(p)for(let i=0;i<p.length;i++){v.setInt16(o,Math.round(muDec(p[i])*32767),true);o+=2}});
  return new Blob([b],{type:'audio/wav'})}
/* --- отправка: захват AudioWorklet (отдельный поток, не «заикается», когда страница занята), иначе ScriptProcessor --- */
function lvWorklet(){const c=LVA.cap;if(!c||LVA.wk||!c.audioWorklet||!window.AudioWorkletNode)return;LVA.wk='loading';
  const code="class C extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(1024);this.n=0}process(i){const x=i[0]&&i[0][0];if(x){for(let k=0;k<x.length;k++){this.b[this.n++]=x[k];if(this.n===1024){this.port.postMessage(this.b);this.b=new Float32Array(1024);this.n=0}}}return true}}registerProcessor('lv-cap',C)";
  const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
  c.audioWorklet.addModule(url).then(()=>{LVA.wk='ok'}).catch(()=>{LVA.wk='no'})}
function lvFeed(x){if(!LVA.on)return;const ratio=LVA.cap.sampleRate/16000;let a=x;
  if(LVA.rest&&LVA.rest.length){a=new Float32Array(LVA.rest.length+x.length);a.set(LVA.rest);a.set(x,LVA.rest.length)}
  let p=LVA.pos||0;while(Math.floor(p+ratio)<=a.length){let s=0,k=0;for(let j=Math.floor(p);j<Math.floor(p+ratio);j++){s+=a[j];k++}LVA.acc.push(k?s/k:0);p+=ratio}
  const f=Math.floor(p);LVA.rest=a.slice(f);LVA.pos=p-f;if(LVA.acc.length>=3200)lvFlush(false)}
function lvGate(a){let g=LVA.gg==null?1:LVA.gg;for(let i=0;i<a.length;i+=160){let e=0;const n=Math.min(160,a.length-i);for(let j=0;j<n;j++)e+=a[i+j]*a[i+j];
    const r=Math.sqrt(e/n),t=r<0.006?0.12:r<0.015?0.12+0.88*(r-0.006)/0.009:1;
    for(let j=0;j<n;j++){g+=(t-g)*(t>g?0.02:0.002);a[i+j]*=g}}LVA.gg=g}
function lvFlush(end){const a=LVA.acc;LVA.acc=[];if(a.length){lvGate(a);const u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=muEnc(a[i]);
    if(LIVE.log)LVA.all.push(u);LIVE.send({k:'pcm',sid:LVA.sid,seq:LVA.seq++,d:lvB64(u)})}
  if(end)LIVE.send({k:'pcm',sid:LVA.sid,end:1,seq:LVA.seq,dur:Math.round((performance.now()-LVA.t0)/1000)})}
function liveStart(stream){if(LVA.stopT){clearTimeout(LVA.stopT);LVA.stopT=null;liveStopNow()}if(LVA.on)return;
  if(!LVA.cap)LVA.cap=new (window.AudioContext||window.webkitAudioContext)();if(LVA.cap.state!=='running')LVA.cap.resume().catch(()=>{});lvWorklet();
  const ctx=LVA.cap;LVA.sid=Math.random().toString(36).slice(2,8);LVA.seq=0;LVA.acc=[];LVA.all=[];LVA.rest=null;LVA.pos=0;LVA.gg=1;LVA.t0=performance.now();
  LVA.src=ctx.createMediaStreamSource(stream);
  if(LVA.wk==='ok'){LVA.proc=new AudioWorkletNode(ctx,'lv-cap');LVA.proc.port.onmessage=e=>lvFeed(e.data)}
  else{LVA.proc=(ctx.createScriptProcessor||ctx.createJavaScriptNode).call(ctx,2048,1,1);LVA.proc.onaudioprocess=e=>lvFeed(e.inputBuffer.getChannelData(0).slice())}
  let node=LVA.src;LVA.lp=[];for(const fq of [7000,7000]){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;f.Q.value=0.7;node.connect(f);node=f;LVA.lp.push(f)}
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=90;node.connect(hp);node=hp;LVA.lp.push(hp);
  const mute=ctx.createGain();mute.gain.value=0;node.connect(LVA.proc);LVA.proc.connect(mute);mute.connect(ctx.destination);LVA.mute=mute;LVA.on=true}
function liveStop(){if(!LVA.on||LVA.stopT)return;LVA.stopT=setTimeout(()=>{LVA.stopT=null;liveStopNow()},350)}
function liveStopNow(){if(!LVA.on)return;LVA.on=false;lvFlush(true);try{LVA.proc.disconnect();LVA.src.disconnect();LVA.mute.disconnect();(LVA.lp||[]).forEach(f=>f.disconnect())}catch(_){}
  const dur=(performance.now()-LVA.t0)/1000;if(LIVE.log&&dur>=0.4)LIVE.log(lvWav(LVA.all),dur,true)}
/* --- приём: играем по порядку с запасом (сам растёт, если сеть «дёргается»); края порций сглажены;
   старые/повторные/опоздавшие порции не играем --- */
const LVP={},LVDONE={};
function lvFade(f,a,b){const n=Math.min(160,f.length>>1);for(let i=0;i<n;i++){const k=i/n;if(a)f[i]*=k;if(b)f[f.length-1-i]*=k}}
function lvHear(on){LIVE.hear(on);lvDuck(on)}
function lvFinish(sid){const P=LVP[sid];if(!P||P.done)return;P.done=true;clearTimeout(P.timer);LVDONE[sid]=1;delete LVP[sid];
  if(!Object.keys(LVP).length)setTimeout(()=>{if(!Object.keys(LVP).length)lvHear(false)},Math.max(0,(P.next-LVA.play.currentTime)*1000));
  if(LIVE.log)LIVE.log(lvWav(P.all),P.dur||1,false)}
function pcmRecv(m){if(LVDONE[m.sid])return;const ctx=lvPlayCtx();let P=LVP[m.sid];
  if(!P){if(m.end&&m.seq===0)return;P=LVP[m.sid]={q:{},want:0,next:0,all:[],timer:null};lvHear(true)}
  P.lastT=performance.now();
  if(m.end){P.end=m.seq;P.dur=m.dur}else if(m.seq>=P.want&&!P.q[m.seq]){const u=lvUnB64(m.d);P.q[m.seq]=u;if(LIVE.log)P.all[m.seq]=u}
  const pump=()=>{while(P.q[P.want]){const u=P.q[P.want];delete P.q[P.want];P.want++;
      const f=new Float32Array(u.length);for(let i=0;i<u.length;i++)f[i]=muDec(u[i]);
      const now=ctx.currentTime,gap=now+0.02>P.next;
      if(gap&&P.next>0)LVA.lead=Math.min(0.9,LVA.lead+0.15);   /* не успели — увеличиваем запас */
      lvFade(f,gap,!P.q[P.want]&&P.end!=null);
      const b=ctx.createBuffer(1,f.length,16000);b.getChannelData(0).set(f);const s=ctx.createBufferSource();s.buffer=b;s.connect(lvOut());
      const t=gap?now+LVA.lead:P.next;s.start(t);P.next=t+b.duration}
    if(P.end!=null&&P.want>=P.end)lvFinish(m.sid)};
  pump();if(P.done)return;clearTimeout(P.timer);   /* потерялась порция — пропускаем её (только вперёд) */
  P.timer=setTimeout(()=>{if(P.done)return;const keys=Object.keys(P.q).map(Number).filter(k=>k>=P.want);
    if(keys.length){P.want=Math.min(...keys);pump()}else if(P.end!=null){P.want=P.end;pump()}
    else setTimeout(()=>{if(!P.done&&performance.now()-P.lastT>4000)lvFinish(m.sid)},4100)},700)}
/* запас медленно уменьшается, если сеть ровная */
setInterval(()=>{if(!Object.keys(LVP).length&&LVA.lead>0.3)LVA.lead=Math.max(0.3,LVA.lead-0.05)},10000);

  dlog('push: выключены');b.classList.remove('busy');pushUI();toast('🔕 Уведомления выключены')}

/* позвать: если сервер недоступен — пробуем снова каждые 8 с до 3 минут, пока не дойдёт или напарник не подключится сам */
let ringTry=null;
async function pushRing(code){clearTimeout(ringTry);const t0=Date.now();let n=0;
  const attempt=async()=>{if(ok&&curCode()===code){dlog('push: напарник уже на связи');return}
    if(curCode()!==code||Date.now()-t0>RING_TTL){dlog('push: так и не достучался до сервера');toast('Не удалось отправить уведомление — сервер недоступен');return}
    n++;const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
    try{const r=await fetch(PUSH+'/ring',{method:'POST',body:JSON.stringify({code,did:did(),name:myName()}),signal:ac.signal});clearTimeout(to);const j=await r.json().catch(()=>({}));
      if(r.status===429){dlog('push: уже звали только что');return}
      dlog('push: позвали (попытка '+n+'), доставлено '+j.sent+' из '+j.targets);
      if(j.sent)toast('🔔 Напарнику отправлено уведомление');else if(j.targets===0)toast('У напарника не включены уведомления');return}
    catch(e){clearTimeout(to);dlog('push: сервер не ответил (попытка '+n+')');if(n===1)toast('Сервер не отвечает — пробую ещё…')}
    ringTry=setTimeout(attempt,8000)};
  attempt()}
/* при запуске: уже подписаны? обновить список комнат на сервере */
let pushOff=false;try{pushOff=localStorage.getItem('vd_push_off')==='1'}catch(_){}
if(pushCan()&&Notification.permission==='granted'&&!pushOff)navigator.serviceWorker.register('sw.js').then(r=>r.pushManager.getSubscription()).then(s=>{pushSub=s;pushUI();pushSync()}).catch(()=>{});
/* нажали на уведомление */
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.ring)ringOpen(e.data.ring,e.data.t)});
{const mm=location.hash.match(/^#ring=([a-z0-9]{6})(?:&t=(\d+))?$/);if(mm){history.replaceState(null,'',location.pathname);setTimeout(()=>ringOpen(mm[1],+mm[2]||0),300)}}
function ringOpen(code,t){if(t&&Date.now()-t>RING_TTL){$('setup').hidden=false;toast('Приглашение устарело — позовите напарника сами');return}ctAnswer(code)}
pushUI();

/* ===== окно поверх (картинка в картинке): пока оно открыто, iPhone не останавливает звук, даже если свернуть приложение.
   В окне — камера напарника, а если её нет — заставка. Звук напарника идёт через это окно. ===== */
let pipV=null,pipCv=null,pipCvS=null,pipDraw=null;
function pipCanvas(){if(!pipCv){pipCv=document.createElement('canvas');pipCv.width=320;pipCv.height=180;pipCvS=pipCv.captureStream(2)}
  const x=pipCv.getContext('2d');let k=0;clearInterval(pipDraw);pipDraw=setInterval(()=>{k^=1;x.fillStyle='#17171a';x.fillRect(0,0,320,180);x.fillStyle='#3ecf6e';x.beginPath();x.arc(160,70,k?16:14,0,7);x.fill();
    x.fillStyle='#fff';x.font='600 22px -apple-system,system-ui,sans-serif';x.textAlign='center';x.fillText('Вдвоём · на связи',160,130)},500);return pipCvS.getVideoTracks()[0]}
function pipStream(){const ms=new MediaStream(),rs=$('rcam').srcObject,rv=rs&&rs.getVideoTracks()[0];
  ms.addTrack(rv&&rv.readyState==='live'?rv:pipCanvas());const ra=raud.srcObject&&raud.srcObject.getAudioTracks()[0];if(ra)ms.addTrack(ra);return ms}
function pipIsOn(){return !!pipV&&(pipV.webkitPresentationMode==='picture-in-picture'||document.pictureInPictureElement===pipV)}
/* окно готовим заранее (тихо играет во время звонка) — тогда по нажатию iPhone открывает его сразу, без задержек */
function pipPrep(){if(!callOn()){return}
  if(!pipV){pipV=document.createElement('video');pipV.setAttribute('playsinline','');pipV.setAttribute('autoplay','');pipV.playsInline=true;pipV.muted=true;
    pipV.style.cssText='position:fixed;left:0;bottom:0;width:96px;height:54px;opacity:.02;pointer-events:none;z-index:0';document.body.appendChild(pipV);
    pipV.addEventListener('webkitpresentationmodechanged',()=>{if(pipV.webkitPresentationMode!=='picture-in-picture')pipOff()});pipV.addEventListener('leavepictureinpicture',pipOff)}
  const want=pipStream(),cur=pipV.srcObject,ids=x=>x?x.getTracks().map(t=>t.id).join():'';
  if(ids(cur)!==ids(want))pipV.srcObject=want;if(pipV.paused)pipV.play().catch(()=>{})}
setInterval(pipPrep,2000);
function pipOn(){if(!callOn()){toast('Сначала подключитесь к напарнику — тогда окно поверх сохранит голос');return}
  if(!pipV||!pipV.srcObject)pipPrep();
  try{pipV.muted=false;   /* всё — сразу по нажатию, без ожиданий: иначе iPhone откажет */
    if(pipV.webkitSupportsPresentationMode&&pipV.webkitSupportsPresentationMode('picture-in-picture'))pipV.webkitSetPresentationMode('picture-in-picture');
    else if(pipV.requestPictureInPicture)pipV.requestPictureInPicture().catch(e=>{dlog('окно поверх: '+(e&&e.message||e));toast('Окно поверх не открылось');pipOff()});
    else throw new Error('телефон не умеет окно поверх');
    pipV.play().catch(()=>{});raud.muted=true;$('pipb').classList.add('ok');dlog('окно поверх: включаю ('+(pipV.readyState)+')');
    setTimeout(()=>{if(!pipIsOn()){dlog('окно поверх: iPhone не открыл ('+(pipV.webkitPresentationMode||'')+', '+pipV.readyState+')');toast('Окно поверх не открылось');pipOff()}else toast('Окно поверх включено — можно сворачивать')},1500)}
  catch(e){dlog('окно поверх: не вышло — '+(e&&e.message||e));toast('Окно поверх не открылось');pipOff()}}
function pipOff(){raud.muted=false;$('pipb').classList.remove('ok');if(pipV)pipV.muted=true}
$('pipb').onclick=()=>{if(pipIsOn()){try{pipV.webkitSetPresentationMode?pipV.webkitSetPresentationMode('inline'):document.exitPictureInPicture()}catch(_){}pipOff()}else pipOn()};
</script></body></html>
