<style>
:root{--bg:#0b0b0c;--panel:rgba(30,30,36,.78);--text:#f2f2f2;--muted:#9a9aa2;--ok:#3ecf6e;--warn:#f5b83d;--bad:#ff4d4d;--accent:#d7dbe2;

 .vwrap.camon{display:flex;flex-direction:column;gap:8px;background:transparent;padding-bottom:8px}

@media (orientation:landscape){
 .cams{left:8px;right:8px;top:auto;bottom:8px;justify-content:space-between;pointer-events:none}
 .cams .tile,.cams .tile.me{width:72px;pointer-events:auto}.cams.big .tile,.cams.big .tile.me{width:110px}
 .cams button{top:-10px;right:-6px;bottom:auto;left:auto;pointer-events:auto}}
@media (orientation:landscape){
 .app{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;grid-template-rows:1fr auto 1fr auto;
  grid-template-areas:"ctl vid vid room" "ctl vid vid camb" "ctl vid vid menu" "seek seek dock dock";column-gap:6px}
 .side,.top{display:contents}.top .sp{display:none}
 .vwrap{grid-area:vid;margin:6px 0 0;min-height:0;height:calc(100% - 6px);width:auto;max-width:100%;aspect-ratio:var(--ar,16/9);justify-self:center}
 .ctl{grid-area:ctl;flex-direction:column;justify-content:center;padding:6px 0 6px 6px;gap:10px}
 .ctl button{width:64px;padding:10px 0;font-size:15px}.ctl #pp{flex:0 0 auto;height:72px;font-size:16px;line-height:1.15}
 #room{grid-area:room;align-self:end;justify-self:center;max-width:76px;white-space:normal;text-align:center;font-size:12px;padding:6px 8px;margin:0 6px 0 0}
 #camb{grid-area:camb;align-self:center;justify-self:center;margin:10px 6px 10px 0}
 #menu{grid-area:menu;align-self:start;justify-self:center;margin:0 6px 0 0}

 .dock2 .extra{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;z-index:5}
 .inp{padding:4px}.inp button{width:36px;height:36px;font-size:16px}.inp input{padding:6px 4px;font-size:15px}}
</style></head><body>
<canvas id="amb" width="32" height="18"></canvas>
<div class="app">
 <div class="vwrap paused" id="vw"><div class="vpic"><video id="v" playsinline webkit-playsinline preload="auto"></video><div class="toast" id="toast"></div><div class="cd" id="cd" hidden></div>
  <div class="ovl" id="log"></div></div>
  <div class="cams" id="cams" hidden><div class="tile"><video id="rcam" autoplay playsinline muted></video><span id="camst">соединяю…</span></div><div class="tile me" id="ltile"><video id="lcam" autoplay playsinline muted></video></div><button id="camx">✕</button></div></div>
 <div class="side">
  <div class="top"><span class="pill" id="room"><i class="dot"></i>Нет</span><span class="sp"></span><button class="pill" id="camb" style="color:#fff">📹</button><button class="pill" id="menu" style="color:#fff">⋯</button></div>
  <div class="ctl"><button id="back">↺ 10</button><button id="pp">▶ Пуск</button><button id="fwd">10 ↻</button></div>
  <div class="seek"><span id="cur">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="dock2">
   <div class="inp"><button id="ptt" title="Рация: держите и говорите">🎙</button><input id="txt" placeholder="Написать в чат…" enterkeyhint="send"><button id="send">➤</button></div>
  </div>
</div>
 </div>
</div>
<div class="sheet" id="setup"><div class="sbox">
 <h2>👥 Смотрим вдвоём</h2>
 <div class="inst" id="inst" hidden></div>
 <p>1. Выберите файл выпуска (show_cut.mp4) — его заранее кладут в «Файлы» на iPhone. Видео никуда не загружается.</p>
 <label class="btn" id="pickl">🎬 Выбрать видео<input type="file" id="pick" accept="video/*,.mp4" hidden></label>
 <p id="fname" style="color:var(--ok)"></p>
 <p>2. Комната: один создаёт и присылает код, второй входит по коду.</p>
 <button id="mk">Создать комнату</button>
 <div class="code" id="code"></div>
 <input id="cin" placeholder="код" autocapitalize="off" autocomplete="off" maxlength="6">
 <button id="join" class="sec">Войти по коду</button>
 <div class="st" id="st"></div>
 <button id="close" class="sec">Готово</button>
</div></div>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
/* подсказка «как установить на экран Домой»: только в браузере (не в уже установленном приложении) */
(function(){const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua),inst=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  const box=document.getElementById('inst');if(!ios||inst||localStorage.getItem('instno'))return;
  const safari=/Safari\//.test(ua)&&!/CriOS|FxiOS|EdgiOS|YaBrowser|OPiOS|Telegram|Instagram|FBAN|FBAV|VK|GSA\//.test(ua);
  box.innerHTML='<span class="x" onclick="this.parentNode.hidden=true;try{localStorage.setItem(\'instno\',1)}catch(_){}">✕</span>'+(safari?
    '<b>📲 Установить на экран «Домой»</b><ol><li>Нажмите <b>⋯</b> (справа внизу) или кнопку <b>Поделиться</b> (квадратик со стрелкой вверх)</li><li>Выберите <b>«Поделиться»</b>, пролистайте вниз → <b>«На экран „Домой“»</b></li><li>Включите «Открыть как веб-приложение» → <b>«Добавить»</b></li></ol>Дальше открывайте значок «Вдвоём» на экране «Домой».':
    '<b>📲 Откройте эту страницу в Safari</b><ol><li>Нажмите <b>⋯</b> или значок браузера справа вверху/внизу</li><li><b>«Открыть в Safari»</b> (или скопируйте ссылку и вставьте в Safari)</li><li>В Safari появится подсказка, как добавить на экран «Домой»</li></ol>Из Telegram, Яндекса и Chrome на экран «Домой» добавить нельзя.');
  box.hidden=false})();
const $=id=>document.getElementById(id),v=$('v');
const me=Math.random().toString(36).slice(2,8);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._h);e._h=setTimeout(()=>e.classList.remove('on'),1400)}
function fmt(t){t=Math.max(0,Math.floor(t||0));return (t>=3600?Math.floor(t/3600)+':'+String(Math.floor(t%3600/60)).padStart(2,'0'):Math.floor(t/60))+':'+String(t%60).padStart(2,'0')}
/* значок для экрана «Домой» */
{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#17171a';x.fillRect(0,0,180,180);
 x.fillStyle='#c9ced8';x.beginPath();x.arc(90,82,58,0,7);x.fill();x.fillStyle='#17171a';x.beginPath();x.moveTo(72,54);x.lineTo(72,110);x.lineTo(116,82);x.fill();
 x.fillStyle='#e6e8ec';x.font='900 30px -apple-system';x.textAlign='center';x.fillText('ТА',90,168);$('appicon').href=c.toDataURL()}
/* --- видео --- */
let unlocked=false;
function unlock(){lvUnlock();if(unlocked||!v.src)return;unlocked=true;const p=v.play();if(p)p.then(()=>v.pause()).catch(()=>{unlocked=false})}
$('pick').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;v.src=URL.createObjectURL(f);v.load();$('fname').textContent='✓ '+f.name;try{localStorage.setItem('tox_fname',f.name)}catch(_){}unlock()});
v.addEventListener('loadedmetadata',()=>{$('dur').textContent=fmt(v.duration);try{const p=JSON.parse(localStorage.getItem('tox_pos')||'null');if(p&&p.t>30){v.currentTime=p.t;toast('↪ с '+fmt(p.t))}}catch(_){}});
v.addEventListener('pause',()=>{$('vw').classList.add('paused');$('pp').textContent='▶ Пуск'});
v.addEventListener('loadedmetadata',()=>{if(v.videoWidth)document.documentElement.style.setProperty('--ar',v.videoWidth+'/'+v.videoHeight)});
v.addEventListener('play',()=>{$('vw').classList.remove('paused');$('pp').textContent='⏸ Пауза'});
setInterval(()=>{if(v.duration){$('cur').textContent=fmt(v.currentTime);if(!sk.drag)$('sk').value=Math.round(1000*v.currentTime/v.duration);try{localStorage.setItem('tox_pos',JSON.stringify({t:v.currentTime}))}catch(_){}}},500);
const sk=$('sk');sk.addEventListener('input',()=>{sk.drag=true;if(v.duration)$('cur').textContent=fmt(sk.value/1000*v.duration)});
sk.addEventListener('change',()=>{sk.drag=false;if(!v.duration)return;v.currentTime=sk.value/1000*v.duration;send({k:'seek',t:v.currentTime})});
function playPause(){if(!v.src){$('setup').hidden=false;return}unlock();
  if(v.paused){if(!started&&ok&&v.currentTime<1){send({k:'cd',t:v.currentTime});countdown(v.currentTime);return}v.play();send({k:'play',t:v.currentTime})}
  else{v.pause();send({k:'pause',t:v.currentTime})}}
let started=false,cdOn=false;
function countdown(t){if(cdOn)return;cdOn=true;started=true;if(t!=null&&Math.abs(v.currentTime-t)>0.3)v.currentTime=t;const e=$('cd');e.hidden=false;let n=3;e.textContent=n;
  const iv=setInterval(()=>{n--;if(n>0)e.textContent=n;else{clearInterval(iv);e.hidden=true;cdOn=false;v.play()}},1000)}
$('pp').onclick=playPause;document.querySelector('.vpic').onclick=playPause;
$('back').onclick=()=>{v.currentTime=Math.max(0,v.currentTime-10);send({k:'seek',t:v.currentTime})};
$('fwd').onclick=()=>{v.currentTime=Math.min(v.duration||0,v.currentTime+10);send({k:'seek',t:v.currentTime})};
/* фон — размытый кадр */
{const ax=$('amb').getContext('2d');setInterval(()=>{if(!v.paused&&v.readyState>=2)try{ax.drawImage(v,0,0,32,18)}catch(_){}},300)}
/* не гасить экран во время просмотра */
let wl=null;async function wake(){try{if('wakeLock' in navigator&&!wl)wl=await navigator.wakeLock.request('screen');wl&&wl.addEventListener('release',()=>wl=null)}catch(_){}}
v.addEventListener('play',wake);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!v.paused)wake()});
/* --- связь: те же комнаты, что у плеера на Mac (MQTT, два брокера) --- */
const BROKERS=['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];let mqs=[],room='',host=false,ok=false,n=0;const seen=new Set();
function send(m){if(!room)return;m.from=me;m.id=me+'-'+(++n);const js=JSON.stringify(m);mqs.forEach(c=>{if(c.connected)c.publish(room,js,{qos:1})})}
let lastPeer=0,tickT=null;function ind(on){$('room').innerHTML='<i class="dot"></i>'+(on?'Да':'Нет');$('room').classList.toggle('ok',on)}
function up(){if(ok)return;ok=true;ind(true);$('st').textContent='Подключено ✓';$('st').style.color='var(--ok)';sys('напарник на связи');
  if(host&&!tickT)tickT=setInterval(()=>{if(!v.paused)send({k:'tick',t:v.currentTime})},10000)}
/* связь живая? раз в 5 с «я тут»; 15 с тишины от напарника — «Нет» */
setInterval(()=>{if(!room)return;send({k:'hb'});if(ok&&Date.now()-lastPeer>15000){ok=false;ind(false);sys('напарник пропал')}},5000);
function join(code,h){room='toxanton/room/'+code;host=h;mqs.forEach(c=>{try{c.end(true)}catch(_){}});mqs=[];
  if(!window.mqtt){$('st').textContent='Нет интернета';return}let opened=false;
  BROKERS.forEach((u,k)=>{const c=mqtt.connect(u,{clientId:'toxm_'+me+'_'+k,clean:true,reconnectPeriod:2000,connectTimeout:8000});mqs.push(c);
    c.on('connect',()=>c.subscribe(room,{qos:1},()=>{if(!opened){opened=true;if(h){$('code').textContent=code;$('st').textContent='Отправьте код напарнику…'}else $('st').textContent='Подключаюсь…'}
      if(!h||ok)c.publish(room,JSON.stringify({k:'hello',from:me,id:me+'-h'+(++n)}),{qos:1})}));
    c.on('message',(t,msg)=>{try{recv(JSON.parse(msg.toString()))}catch(_){}})});
  try{localStorage.setItem('tox_room',JSON.stringify({code,h}))}catch(_){}}
function recv(m){if(m.from===me)return;if(m.id){if(seen.has(m.id))return;seen.add(m.id)}lastPeer=Date.now();if(!ok&&m.k==='hb')up();
  if(m.k==='hello'){send({k:'hi'});up()}else if(m.k==='hi')up();

/* ===== живая рация: звук 16 кГц, μ-law, порции по 0,2 с через комнату; у собеседника играет сразу (Web Audio) =====
   Работает одинаково в Chrome, Safari и на iPhone. Хуки задаёт приложение: LIVE.send(msg), LIVE.toast(text),
   LIVE.log(blob,dur,mine) или null (не сохранять фразы в чат), LIVE.out() — id устройства вывода (наушники) или '',
   LIVE.hear(on), LIVE.video() — видео шоу: пока говорит напарник, шоу приглушается до LIVE.duck (0…1). */
const LIVE={send:()=>{},toast:()=>{},log:null,out:()=>'',hear:()=>{},video:()=>null,duck:0.35,boost:1.4};
const LVA={cap:null,play:null,src:null,proc:null,on:false,sid:'',seq:0,acc:[],all:[],rest:null,t0:0,lead:0.3};
function lvPlayCtx(){if(!LVA.play){LVA.play=new (window.AudioContext||window.webkitAudioContext)();const c=LVA.play;
    try{LVA.dest=c.createMediaStreamDestination();LVA.el=new Audio();LVA.el.srcObject=LVA.dest.stream;LVA.el.setAttribute('playsinline','')}catch(_){LVA.dest=null}
    const out=LVA.dest||c.destination;
    /* рация громче и ровнее: усиление + компрессор (не даёт перегружать) */
    try{LVA.comp=c.createDynamicsCompressor();LVA.comp.threshold.value=-18;LVA.comp.knee.value=10;LVA.comp.ratio.value=3;LVA.comp.attack.value=0.005;LVA.comp.release.value=0.2;
      LVA.boost=c.createGain();LVA.boost.gain.value=LIVE.boost;LVA.boost.connect(LVA.comp);LVA.comp.connect(out)}catch(_){LVA.boost=null}
    /* постоянная «почти тишина» в выход: поток не пустеет между фразами */
    try{const g=c.createGain();g.gain.value=0.00001;const o=c.createOscillator();o.frequency.value=40;o.connect(g);g.connect(out);o.start()}catch(_){}}
  if(LVA.play.state!=='running')LVA.play.resume().catch(()=>{});
  if(LVA.el&&LVA.el.paused)LVA.el.play().catch(()=>{});
  const o=LIVE.out();if(o!==LVA.sink){LVA.sink=o;const t=LVA.el&&LVA.el.setSinkId?LVA.el:LVA.play;if(t.setSinkId)t.setSinkId(o||'').catch(()=>{})}return LVA.play}
function lvOut(){return LVA.boost||LVA.dest||LVA.play.destination}
/* --- приглушение шоу, пока говорит напарник. Где громкость видео не меняется (iPhone) — через Web Audio --- */
function lvVolOK(v){if(LVA.volok==null){const t=v.volume;try{v.volume=0.5}catch(_){}LVA.volok=Math.abs(v.volume-0.5)<0.01;try{v.volume=t}catch(_){}}return LVA.volok}
function lvRoute(){const v=LIVE.video();if(!v||LVA.vgain||lvVolOK(v)||!LVA.play||LVA.play.state!=='running')return;
  try{const c=LVA.play;LVA.vgain=c.createGain();c.createMediaElementSource(v).connect(LVA.vgain);LVA.vgain.connect(LVA.dest||c.destination)}catch(_){LVA.vgain=null;LVA.volok=true}}
function lvDuck(on){const v=LIVE.video();if(!v)return;const to=on?LIVE.duck:1;lvRoute();
  if(LVA.vgain){const g=LVA.vgain.gain,t=LVA.play.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(to,t+(on?0.15:0.6));return}
  clearInterval(LVA.duckT);const base=LVA.vbase!=null?LVA.vbase:(LVA.vbase=v.volume);const tgt=base*to;
  LVA.duckT=setInterval(()=>{const d=tgt-v.volume;if(Math.abs(d)<0.02){v.volume=tgt;clearInterval(LVA.duckT);if(!on)LVA.vbase=null;return}v.volume=Math.max(0,Math.min(1,v.volume+d*(on?0.5:0.15)))},30)}
function lvUnlock(){try{lvPlayCtx()}catch(_){}
  try{if(!LVA.cap)LVA.cap=new (window.AudioContext||window.webkitAudioContext)();if(LVA.cap.state!=='running')LVA.cap.resume().catch(()=>{});lvWorklet()}catch(_){}
  setTimeout(lvRoute,300)}
/* iPhone запускает звук только из касания — «будим» звук при любом касании/клике */
['touchend','click','keydown'].forEach(t=>document.addEventListener(t,()=>{if(!LVA.play||LVA.play.state!=='running'||(LVA.el&&LVA.el.paused)||!LVA.cap||LVA.cap.state!=='running'||(!LVA.vgain&&LIVE.video()&&LVA.volok!==true))lvUnlock()},{passive:true}));
function muEnc(x){x=Math.max(-1,Math.min(1,x||0));const s=x<0?0x80:0;let m=Math.log(1+255*Math.abs(x))/Math.log(256);return (~(s|Math.round(m*127)))&0xFF}
function muDec(u){u=~u&0xFF;const s=u&0x80,m=(u&0x7F)/127,x=(Math.pow(256,m)-1)/255;return s?-x:x}
function lvB64(u){let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(b)}
function lvUnB64(d){const s=atob(d),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function lvWav(parts){let n=0;parts.forEach(p=>{if(p)n+=p.length});const b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);let o=44;parts.forEach(p=>{if(p)for(let i=0;i<p.length;i++){v.setInt16(o,Math.round(muDec(p[i])*32767),true);o+=2}});
  return new Blob([b],{type:'audio/wav'})}
/* --- отправка: захват AudioWorklet (отдельный поток, не «заикается», когда страница занята), иначе ScriptProcessor --- */
function lvWorklet(){const c=LVA.cap;if(!c||LVA.wk||!c.audioWorklet||!window.AudioWorkletNode)return;LVA.wk='loading';
  const code="class C extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(1024);this.n=0}process(i){const x=i[0]&&i[0][0];if(x){for(let k=0;k<x.length;k++){this.b[this.n++]=x[k];if(this.n===1024){this.port.postMessage(this.b);this.b=new Float32Array(1024);this.n=0}}}return true}}registerProcessor('lv-cap',C)";
  const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
  c.audioWorklet.addModule(url).then(()=>{LVA.wk='ok'}).catch(()=>{LVA.wk='no'})}
function lvFeed(x){if(!LVA.on)return;const ratio=LVA.cap.sampleRate/16000;let a=x;
  if(LVA.rest&&LVA.rest.length){a=new Float32Array(LVA.rest.length+x.length);a.set(LVA.rest);a.set(x,LVA.rest.length)}
  let p=LVA.pos||0;while(Math.floor(p+ratio)<=a.length){let s=0,k=0;for(let j=Math.floor(p);j<Math.floor(p+ratio);j++){s+=a[j];k++}LVA.acc.push(k?s/k:0);p+=ratio}
  const f=Math.floor(p);LVA.rest=a.slice(f);LVA.pos=p-f;if(LVA.acc.length>=3200)lvFlush(false)}
function lvGate(a){let g=LVA.gg==null?1:LVA.gg;for(let i=0;i<a.length;i+=160){let e=0;const n=Math.min(160,a.length-i);for(let j=0;j<n;j++)e+=a[i+j]*a[i+j];
    const r=Math.sqrt(e/n),t=r<0.006?0.12:r<0.015?0.12+0.88*(r-0.006)/0.009:1;
    for(let j=0;j<n;j++){g+=(t-g)*(t>g?0.02:0.002);a[i+j]*=g}}LVA.gg=g}
function lvFlush(end){const a=LVA.acc;LVA.acc=[];if(a.length){lvGate(a);const u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=muEnc(a[i]);
    if(LIVE.log)LVA.all.push(u);LIVE.send({k:'pcm',sid:LVA.sid,seq:LVA.seq++,d:lvB64(u)})}
  if(end)LIVE.send({k:'pcm',sid:LVA.sid,end:1,seq:LVA.seq,dur:Math.round((performance.now()-LVA.t0)/1000)})}
function liveStart(stream){if(LVA.stopT){clearTimeout(LVA.stopT);LVA.stopT=null;liveStopNow()}if(LVA.on)return;
  if(!LVA.cap)LVA.cap=new (window.AudioContext||window.webkitAudioContext)();if(LVA.cap.state!=='running')LVA.cap.resume().catch(()=>{});lvWorklet();
  const ctx=LVA.cap;LVA.sid=Math.random().toString(36).slice(2,8);LVA.seq=0;LVA.acc=[];LVA.all=[];LVA.rest=null;LVA.pos=0;LVA.gg=1;LVA.t0=performance.now();
  LVA.src=ctx.createMediaStreamSource(stream);
  if(LVA.wk==='ok'){LVA.proc=new AudioWorkletNode(ctx,'lv-cap');LVA.proc.port.onmessage=e=>lvFeed(e.data)}
  else{LVA.proc=(ctx.createScriptProcessor||ctx.createJavaScriptNode).call(ctx,2048,1,1);LVA.proc.onaudioprocess=e=>lvFeed(e.inputBuffer.getChannelData(0).slice())}
  let node=LVA.src;LVA.lp=[];for(const fq of [7000,7000]){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;f.Q.value=0.7;node.connect(f);node=f;LVA.lp.push(f)}
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=90;node.connect(hp);node=hp;LVA.lp.push(hp);
  const mute=ctx.createGain();mute.gain.value=0;node.connect(LVA.proc);LVA.proc.connect(mute);mute.connect(ctx.destination);LVA.mute=mute;LVA.on=true}

function liveStopNow(){if(!LVA.on)return;LVA.on=false;lvFlush(true);try{LVA.proc.disconnect();LVA.src.disconnect();LVA.mute.disconnect();(LVA.lp||[]).forEach(f=>f.disconnect())}catch(_){}
  const dur=(performance.now()-LVA.t0)/1000;if(LIVE.log&&dur>=0.4)LIVE.log(lvWav(LVA.all),dur,true)}
/* --- приём: играем по порядку с запасом (сам растёт, если сеть «дёргается»); края порций сглажены;
   старые/повторные/опоздавшие порции не играем --- */
const LVP={},LVDONE={};
function lvFade(f,a,b){const n=Math.min(160,f.length>>1);for(let i=0;i<n;i++){const k=i/n;if(a)f[i]*=k;if(b)f[f.length-1-i]*=k}}
function lvHear(on){LIVE.hear(on);lvDuck(on)}
function lvFinish(sid){const P=LVP[sid];if(!P||P.done)return;P.done=true;clearTimeout(P.timer);LVDONE[sid]=1;delete LVP[sid];
  if(!Object.keys(LVP).length)setTimeout(()=>{if(!Object.keys(LVP).length)lvHear(false)},Math.max(0,(P.next-LVA.play.currentTime)*1000));
  if(LIVE.log)LIVE.log(lvWav(P.all),P.dur||1,false)}
function pcmRecv(m){if(LVDONE[m.sid])return;const ctx=lvPlayCtx();let P=LVP[m.sid];
  if(!P){if(m.end&&m.seq===0)return;P=LVP[m.sid]={q:{},want:0,next:0,all:[],timer:null};lvHear(true)}
  P.lastT=performance.now();
  if(m.end){P.end=m.seq;P.dur=m.dur}else if(m.seq>=P.want&&!P.q[m.seq]){const u=lvUnB64(m.d);P.q[m.seq]=u;if(LIVE.log)P.all[m.seq]=u}
  const pump=()=>{while(P.q[P.want]){const u=P.q[P.want];delete P.q[P.want];P.want++;
      const f=new Float32Array(u.length);for(let i=0;i<u.length;i++)f[i]=muDec(u[i]);
      const now=ctx.currentTime,gap=now+0.02>P.next;
      if(gap&&P.next>0)LVA.lead=Math.min(0.9,LVA.lead+0.15);   /* не успели — увеличиваем запас */
      lvFade(f,gap,!P.q[P.want]&&P.end!=null);
      const b=ctx.createBuffer(1,f.length,16000);b.getChannelData(0).set(f);const s=ctx.createBufferSource();s.buffer=b;s.connect(lvOut());
      const t=gap?now+LVA.lead:P.next;s.start(t);P.next=t+b.duration}

  pump();if(P.done)return;clearTimeout(P.timer);   /* потерялась порция — пропускаем её (только вперёд) */
  P.timer=setTimeout(()=>{if(P.done)return;const keys=Object.keys(P.q).map(Number).filter(k=>k>=P.want);
    if(keys.length){P.want=Math.min(...keys);pump()}else if(P.end!=null){P.want=P.end;pump()}
    else setTimeout(()=>{if(!P.done&&performance.now()-P.lastT>4000)lvFinish(m.sid)},4100)},700)}
/* запас медленно уменьшается, если сеть ровная */
setInterval(()=>{if(!Object.keys(LVP).length&&LVA.lead>0.3)LVA.lead=Math.max(0.3,LVA.lead-0.05)},10000);

/* --- рация: держите 🎙 — собеседник слышит сразу (живой звук), фраза потом остаётся в чате --- */
const b64=lvB64,unb64=lvUnB64;
let stream=null;
LIVE.send=send;LIVE.toast=toast;LIVE.log=null;LIVE.video=()=>$('v');LIVE.hear=on=>$('ptt').classList.toggle('hear',on);
async function pttDown(e){e&&e.preventDefault();if(LVA.on&&!LVA.stopT)return;if(!room){$('setup').hidden=false;return}lvUnlock();
  try{if(!stream||!stream.getAudioTracks().some(t=>t.readyState==='live'))stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}catch(_){toast('🎙 нет доступа к микрофону');return}
  liveStart(stream);$('ptt').classList.add('rec');if(navigator.vibrate)navigator.vibrate(20)}

function vmPlay(b){new Audio(URL.createObjectURL(b)).play().catch(()=>toast('Нажмите на голосовое в чате'))}
function vmLog(b,dur,mine){const d=document.createElement('div');d.className=mine?'me':'them';d.innerHTML='<b>'+(mine?'Я':'Напарник')+':</b> <span class="vm">🎙 '+Math.max(1,Math.round(dur))+' с ▶</span>';d.onclick=e=>{e.stopPropagation();vmPlay(b)};feed(d,40)}

  const blob=new Blob([unb64(b.join(''))],{type:m.mime||'audio/mp4'});vmLog(blob,m.dur,false);toast('🎙 напарник');vmPlay(blob)}
const lives={};function lvRecv(m){let L=lives[m.sid]||(lives[m.sid]={q:{},mime:m.mime});$('ptt').classList.add('hear');
  if(m.end){L.total=m.seq;L.dur=m.dur}else L.q[m.seq]=unb64(m.d);
  if(L.total!=null&&Object.keys(L.q).length>=L.total&&!L.done){L.done=true;$('ptt').classList.remove('hear');const blob=new Blob([...Array(L.total).keys()].map(i=>L.q[i]).filter(Boolean),{type:L.mime});vmLog(blob,L.dur||1,false);vmPlay(blob)}}

/* --- камеры: WebRTC напрямую между устройствами, описание соединения — через ту же комнату (совместимо с плеером на Mac) --- */
let pc=null,camLocal=null;const ICE=[{urls:['stun:stun.l.google.com:19302','stun:stun.cloudflare.com:3478']}];
async function zip(str){const cs=new Blob([str]).stream().pipeThrough(new CompressionStream('deflate-raw'));return b64(new Uint8Array(await new Response(cs).arrayBuffer()))}
async function unzip(d){return await new Response(new Blob([unb64(d)]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}
async function sigSend(type,desc){const d=await zip(JSON.stringify(desc)),id=Math.random().toString(36).slice(2,7),k=Math.ceil(d.length/3000);
  for(let i=0;i<k;i++)send({k:'sig',type,id,i,n:k,d:d.slice(i*3000,(i+1)*3000)})}
const sigBuf={};async function sigRecv(m){const b=sigBuf[m.id]=sigBuf[m.id]||[];b[m.i]=m.d;if(b.filter(x=>x).length<m.n)return;delete sigBuf[m.id];
  const desc=JSON.parse(await unzip(b.join('')));if(m.type==='offer')await camStart(false,desc);else if(m.type==='answer'&&pc&&pc.signalingState==='have-local-offer')await pc.setRemoteDescription(desc)}
function waitIce(){return new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,3000);pc.addEventListener('icegatheringstatechange',()=>{if(pc&&pc.iceGatheringState==='complete'){clearTimeout(t);r()}})})}

  try{camLocal=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240},frameRate:{ideal:15}},audio:false})}catch(_){camLocal=null;toast('📹 нет доступа к камере')}
  if(camLocal)camLocal.getTracks().forEach(t=>pc.addTrack(t,camLocal));else pc.addTransceiver('video',{direction:'recvonly'});
  $('lcam').srcObject=camLocal;$('ltile').hidden=!camLocal;pc.ontrack=e=>{$('rcam').srcObject=e.streams[0]||new MediaStream([e.track])};
  pc.onconnectionstatechange=()=>{if(!pc)return;const s=pc.connectionState;$('camst').textContent=s==='connected'?'':s==='failed'?'не удалось соединиться':s==='disconnected'?'связь прервалась…':'соединяю…'};
  $('cams').hidden=false;$('vw').classList.add('camon');$('camb').classList.add('ok');$('camst').textContent='соединяю…';
  if(initiator){await pc.setLocalDescription(await pc.createOffer({offerToReceiveVideo:true}));await waitIce();sigSend('offer',pc.localDescription)}
  else{await pc.setRemoteDescription(offer);await pc.setLocalDescription(await pc.createAnswer());await waitIce();sigSend('answer',pc.localDescription)}}
function camStop(tell){if(pc){pc.close();pc=null}if(camLocal){camLocal.getTracks().forEach(t=>t.stop());camLocal=null}
  $('rcam').srcObject=null;$('lcam').srcObject=null;$('cams').hidden=true;$('vw').classList.remove('camon');$('camb').classList.remove('ok');if(tell)send({k:'camoff'})}
